name: verify
on: [push, pull_request]
jobs:
  cpp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, compiler: gcc, preset: dev}
          - {os: ubuntu-24.04, compiler: clang, preset: dev}
          - {os: ubuntu-24.04, compiler: gcc, preset: asan}
          - {os: ubuntu-24.04, compiler: gcc, preset: ubsan}
          - {os: macos-15, compiler: llvm, preset: dev}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libcurl4-openssl-dev libsqlite3-dev libssl-dev ripgrep
      - name: GCC toolchain
        if: matrix.compiler == 'gcc'
        run: |
          echo 'CC=gcc' >> "$GITHUB_ENV"
          echo 'CXX=g++' >> "$GITHUB_ENV"
      - name: Clang toolchain
        if: matrix.compiler == 'clang'
        run: |
          echo 'CC=clang' >> "$GITHUB_ENV"
          echo 'CXX=clang++' >> "$GITHUB_ENV"
      - name: macOS toolchain
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          brew install llvm ninja curl sqlite openssl@3 ripgrep
          echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
          echo 'CXXFLAGS=-stdlib=libc++' >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix llvm)/lib/c++ -Wl,-rpath,$(brew --prefix llvm)/lib/c++" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix curl);$(brew --prefix sqlite);$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - run: python3 -m unittest discover -s bench/tests -v
      - name: Private release updater tests
        if: matrix.compiler == 'gcc' && matrix.preset == 'dev'
        run: python3 -m unittest discover -s tests/update -v
      - name: Install from source on macOS
        if: runner.os == 'macOS'
        run: |
          prefix="$RUNNER_TEMP/platypus-macos-install"
          PLATYPUS_INSTALL_PREFIX="$prefix" \
            PLATYPUS_BUILD_DIR="$RUNNER_TEMP/platypus-macos-build" \
            PLATYPUS_BUILD_JOBS=2 scripts/install-macos.sh
          "$prefix/bin/platypus" --version | grep -Fx '0.1.0'
          "$prefix/bin/llama-server" --version | grep 'commit 2d8a325'
          PLATYPUS_MODEL_CATALOG="$prefix/share/platypus/profiles/catalog.json" \
            "$prefix/bin/platypus" models list
      - name: Install and catalog smoke test
        run: |
          prefix="$RUNNER_TEMP/platypus-install"
          cmake --install "build/${{ matrix.preset }}" --prefix "$prefix"
          PLATYPUS_MODEL_CATALOG="$prefix/share/platypus/profiles/catalog.json" \
            "$prefix/bin/platypus" models list
  vulkan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Vulkan build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++ libcurl4-openssl-dev libsqlite3-dev libssl-dev ripgrep libvulkan-dev glslc spirv-headers
      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ctest --preset dev --output-on-failure
      - name: Build pinned Vulkan llama-server
        run: |
          PLATYPUS_LLAMA_BACKEND=vulkan \
            PLATYPUS_INSTALL_PREFIX="$RUNNER_TEMP/platypus-vulkan" \
            PLATYPUS_BUILD_DIR="$RUNNER_TEMP/platypus-vulkan-build" \
            PLATYPUS_BUILD_JOBS=2 scripts/build-llama-server.sh
          "$RUNNER_TEMP/platypus-vulkan/bin/llama-server" --version | grep 'commit 2d8a325'
  cuda:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: '12.9.1', image: 'nvidia/cuda:12.9.1-devel-ubuntu24.04'}
          - {version: '13.0.0', image: 'nvidia/cuda:13.0.0-devel-ubuntu24.04'}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned CUDA llama-server in NVIDIA container
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP:/runner-temp" \
            --workdir /workspace \
            --env PLATYPUS_CUDA_VERSION="${{ matrix.version }}" \
            "${{ matrix.image }}" bash -ec '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates git cmake ninja-build g++ libssl-dev
              PLATYPUS_LLAMA_BACKEND=cuda \
                PLATYPUS_INSTALL_PREFIX="/runner-temp/platypus-cuda-${PLATYPUS_CUDA_VERSION}" \
                PLATYPUS_BUILD_DIR="/runner-temp/platypus-cuda-build-${PLATYPUS_CUDA_VERSION}" \
                PLATYPUS_BUILD_JOBS=2 scripts/build-llama-server.sh
              "/runner-temp/platypus-cuda-${PLATYPUS_CUDA_VERSION}/bin/llama-server" --version \
                | grep "commit 2d8a325"
            '
  pinned-server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ libcurl4-openssl-dev libsqlite3-dev libssl-dev ripgrep
      - name: Install Platypus and pinned CPU llama-server
        run: |
          prefix="$RUNNER_TEMP/platypus-install"
          PLATYPUS_INSTALL_PREFIX="$prefix" \
            PLATYPUS_BUILD_DIR="$RUNNER_TEMP/platypus-build" \
            PLATYPUS_BUILD_JOBS=2 CMAKE_BUILD_PARALLEL_LEVEL=2 scripts/install-linux.sh
          "$prefix/bin/platypus" --version | grep -Fx '0.1.0'
          models="$(PLATYPUS_MODEL_CATALOG="$prefix/share/platypus/profiles/catalog.json" \
            "$prefix/bin/platypus" models list)"
          printf '%s\n' "$models" | grep -F 'ornith-1.0-9b-q4_k_m'
          test "$(printf '%s\n' "$models" | wc -l)" -eq 5
          "$prefix/bin/llama-server" --version | grep 'commit 2d8a325'
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fuzz prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libclang-rt-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev ripgrep
      - name: Configure instrumented fuzz targets
        run: >-
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++ -DPLATYPUS_BUILD_FUZZERS=ON
          -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/fuzz --target fuzz_tool_calls fuzz_edit_format -j2
      - name: Fuzz smoke campaign
        run: |
          mkdir -p build/fuzz/corpus/tool_calls
          cp tests/fuzz/corpus/tool_calls/* build/fuzz/corpus/tool_calls/
          ./build/fuzz/fuzz_tool_calls build/fuzz/corpus/tool_calls -runs=10000 -max_len=65537 -timeout=5 -artifact_prefix=build/fuzz/
          mkdir -p build/fuzz/corpus/edit_format
          cp tests/fuzz/corpus/edit_format/* build/fuzz/corpus/edit_format/
          ./build/fuzz/fuzz_edit_format build/fuzz/corpus/edit_format -runs=10000 -max_len=1024 -timeout=2 -artifact_prefix=build/fuzz/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parser-fuzz-artifacts
          path: |
            build/fuzz/crash-*
            build/fuzz/timeout-*
            build/fuzz/oom-*
