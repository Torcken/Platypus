# Template source: https://huggingface.co/google/gemma-4-12B-it/blob/3ba05ed24de502e2b6d1f9a1de1bfed0247c6d8a/chat_template.jinja
# Text-only turn rendering; native tool-history parity requires real-model verification.
name = "gemma-4" # Project profile identifier.
model_id = "google/gemma-4-12B-it" # Publisher model repository.
base_url = "http://127.0.0.1:8080" # Local project default.
tool_syntax = "gemma" # Source: template native tool_call delimiters.
context_tokens = 16384 # Conservative project default, independently configurable per deployment.
temperature = 0.3 # Project experiment setting; not a publisher recommendation.
[sampling]
top_k = 40 # Project value; matches the pinned llama-server default.
top_p = 0.95 # Project value; matches the pinned llama-server default.
min_p = 0.05 # Project value; matches the pinned llama-server default.
stop_strings = ["<turn|>", "<|tool_response>"] # Source: template turn/tool-response boundaries.
[template]
turn_prefix = "<|turn>{role}\n" # Source: role prefix.
turn_suffix = "<turn|>\n" # Source: role suffix.
assistant_role = "model" # Source: assistant role mapping.
generation_suffix = "<|channel>thought\n<channel|>" # Source: enable_thinking=false branch.
[reasoning]
open = "<|channel>thought" # Source: thinking channel.
close = "<channel|>" # Source: channel closure.
preserve = false # Project default; ADR-007.
